name: Sync Fork with Public Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Personal Repo (develop)
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name 'woojaemin'
          git config --global user.email 'dnwoals19@naver.com'

      - name: Add & Fetch Upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/OZ-Coding-School/oz_externship_fe_06_team4.git
          git fetch upstream --prune

      - name: Debug upstream branches
        run: |
          git branch -r | sed -n '1,120p'

      - name: Merge upstream/develop into develop
        run: |
          git merge upstream/develop -m "chore: sync with upstream develop"

      - name: Push to Personal Repo
        run: |
          git push origin develop
